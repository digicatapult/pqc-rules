name: Test Semgrep rules and PQC correlator

on:
  push:
    branches-ignore: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test tooling
        run: pip install -r requirements-dev.txt
      - name: Validate Semgrep rule schema
        run: semgrep --validate --metrics=off --config rules/
      - name: Run Semgrep rule tests
        run: semgrep scan --test --metrics=off --config rules/ rules/
      - name: Verify TypeScript fixtures
        run: python scripts/test_typescript_fixtures.py
      - name: Run correlator and rule metadata tests
        env:
          PYTHONPATH: correlate
        run: python -m pytest -q correlate/tests
