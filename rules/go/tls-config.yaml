rules:
  - id: pqc.go.tls-legacy-version
    languages: [go]
    severity: ERROR
    message: |
      tls.Config accepts TLS 1.0 / 1.1. Deprecated by RFC 8996 and unable to
      negotiate post-quantum key exchange. Set MinVersion: tls.VersionTLS13.
    metadata:
      category: security
      pqc-category: classically-broken
      pqc-family: TLS-legacy
      pqc-risk: broken
      nist-pqc-replacement: "TLS 1.3 with X25519MLKEM768"
    patterns:
      - pattern-either:
          - pattern: "tls.Config{..., MinVersion: $V, ...}"
          - pattern: $CFG.MinVersion = $V
      - metavariable-regex:
          metavariable: $V
          regex: ^tls\.Version(TLS10|TLS11|SSL30)$

  - id: pqc.go.tls-hybrid-groups
    languages: [go]
    severity: INFO
    message: |
      TLS curve preferences include a hybrid post-quantum group (ML-KEM).
      This is the recommended transition configuration.
    metadata:
      category: security
      pqc-category: pqc-hybrid
      pqc-family: ML-KEM
      pqc-risk: hybrid
      nist-pqc-replacement: "n/a"
    pattern-either:
      - pattern: "[]tls.CurveID{..., tls.X25519MLKEM768, ...}"
      - pattern: "[]tls.CurveID{..., tls.SecP256r1MLKEM768, ...}"
      - pattern: "[]tls.CurveID{..., tls.SecP384r1MLKEM1024, ...}"

  - id: pqc.go.tls-classical-groups
    languages: [go]
    severity: WARNING
    message: |
      tls.Config CurvePreferences restricted to classical curves only.
      Harvest-now-decrypt-later exposure. Add tls.X25519MLKEM768 first.
    metadata:
      category: security
      pqc-category: shor-broken
      pqc-family: ECC
      pqc-risk: vulnerable
      nist-pqc-replacement: "X25519MLKEM768 (hybrid ML-KEM, FIPS 203)"
    # Only a literal list is judged here. nil means Go's defaults (hybrid first), and a
    # variable or call is judged where its list literal is written.
    patterns:
      - pattern: "tls.Config{..., CurvePreferences: []tls.CurveID{...}, ...}"
      - pattern-not: "tls.Config{..., CurvePreferences: []tls.CurveID{..., tls.X25519MLKEM768, ...}, ...}"
      - pattern-not: "tls.Config{..., CurvePreferences: []tls.CurveID{..., tls.SecP256r1MLKEM768, ...}, ...}"
      - pattern-not: "tls.Config{..., CurvePreferences: []tls.CurveID{..., tls.SecP384r1MLKEM1024, ...}, ...}"
