rules:
  - id: pqc.javascript.tls-legacy-version
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      TLS configured to accept TLS 1.0 / 1.1 (or SSL). These versions are
      deprecated (RFC 8996) and cannot negotiate post-quantum key exchange.
      Set minVersion to 'TLSv1.3' (or at least 'TLSv1.2').
    metadata:
      category: security
      pqc-category: classically-broken
      pqc-family: TLS-legacy
      pqc-risk: broken
      nist-pqc-replacement: "TLS 1.3 with X25519MLKEM768"
    patterns:
      - pattern-either:
          - pattern: "{..., minVersion: $V, ...}"
          - pattern: "{..., secureProtocol: $V, ...}"
      - metavariable-regex:
          metavariable: $V
          regex: ^['"](TLSv1|TLSv1\.1|TLSv1_method|TLSv1_1_method|SSLv3_method|SSLv23_method)['"]$

  - id: pqc.javascript.tls-classical-groups
    languages: [javascript, typescript]
    severity: WARNING
    message: |
      TLS key-exchange groups restricted to classical curves only. Harvest-
      now-decrypt-later exposure: recorded traffic can be decrypted once a
      CRQC exists. Include the hybrid group X25519MLKEM768 first.
    metadata:
      category: security
      pqc-category: shor-broken
      pqc-family: ECC
      pqc-risk: vulnerable
      nist-pqc-replacement: "X25519MLKEM768 (hybrid ML-KEM, FIPS 203)"
    patterns:
      - pattern: "{..., ecdhCurve: $G, ...}"
      - metavariable-regex:
          metavariable: $G
          # "auto" (Node's default) lets OpenSSL choose, which includes hybrid groups on OpenSSL 3.5+.
          regex: (?i)^['"](?!auto['"])(?!.*mlkem)[^'"]+['"]$

  - id: pqc.javascript.tls-hybrid-groups
    languages: [javascript, typescript]
    severity: INFO
    message: |
      TLS key-exchange groups include a hybrid post-quantum group (ML-KEM).
      This is the recommended transition configuration.
    metadata:
      category: security
      pqc-category: pqc-hybrid
      pqc-family: ML-KEM
      pqc-risk: hybrid
      nist-pqc-replacement: "n/a"
    patterns:
      - pattern: "{..., ecdhCurve: $G, ...}"
      - metavariable-regex:
          metavariable: $G
          regex: (?i).*mlkem
