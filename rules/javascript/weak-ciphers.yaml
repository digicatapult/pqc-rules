rules:
  - id: pqc.javascript.des
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      DES detected. 56-bit key brute-forceable in seconds.
      Migrate to AES-256-GCM.
    metadata:
      category: security
      pqc-category: classically-broken
      pqc-family: DES
      pqc-risk: broken
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      nist-pqc-replacement: "AES-256-GCM"
    patterns:
      - pattern-either:
          - pattern: $C.createCipheriv($ALG, ...)
          - pattern: createCipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['"`](des|des-cbc|des-ecb)['"`]$

  - id: pqc.javascript.3des
    languages: [javascript, typescript]
    severity: WARNING
    message: |
      Triple DES detected. Vulnerable to Sweet32 birthday attacks.
      Migrate to AES-256-GCM.
    metadata:
      category: security
      pqc-category: classically-broken
      pqc-family: 3DES
      pqc-risk: broken
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      nist-pqc-replacement: "AES-256-GCM"
    patterns:
      - pattern-either:
          - pattern: $C.createCipheriv($ALG, ...)
          - pattern: createCipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['"`](des-ede3|des-ede3-cbc|des3)['"`]$

  - id: pqc.javascript.rc4
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      RC4 detected. Keystream biases make it broken; prohibited by RFC 7465.
      Migrate to AES-256-GCM or ChaCha20-Poly1305.
    metadata:
      category: security
      pqc-category: classically-broken
      pqc-family: RC4
      pqc-risk: broken
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      nist-pqc-replacement: "AES-256-GCM or ChaCha20-Poly1305"
    patterns:
      - pattern-either:
          - pattern: $C.createCipheriv($ALG, ...)
          - pattern: createCipheriv($ALG, ...)
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^['"`](rc4|rc4-40)['"`]$
